# Rules tests on every push and pull request, without Unity.
# Tools/RulesTests compiles Assets/Rules and Assets/Rules.Tests on .NET 8 and runs them with NUnit.
# (Unity's own test runner stays the reference; the client logic tests run only in Unity.)

name: Rules tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore
      run: dotnet restore Tools/RulesTests
    - name: Build
      run: dotnet build Tools/RulesTests --no-restore
    - name: Test
      run: dotnet test Tools/RulesTests --no-build --verbosity normal
