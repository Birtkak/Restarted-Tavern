# Windows build of the SimRunner tool (Tools/SimRunner) on every push and pull request.
# It runs a short simulation report as a smoke test (every prototype deck plays every deck with the bots), then
# uploads SimRunner and that report as build artifacts, so the tool can be downloaded without building it.

name: SimRunner (Windows)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Publish SimRunner
      run: dotnet publish Tools/SimRunner -c Release -o publish/SimRunner
    - name: Smoke test (short simulation report)
      run: publish/SimRunner/SimRunner.exe -simGames 20 -out publish/simulation-smoke.md
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SimRunner
        path: publish/
